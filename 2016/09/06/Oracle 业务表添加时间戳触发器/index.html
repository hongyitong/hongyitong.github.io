    <div class="post-body" itemprop="articleBody"><figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">/*Oracle 业务表添加时间戳触发器*/</span>  </span><br><span class="line"><span class="keyword">CREATE</span> <span class="keyword">OR</span> REPLACE <span class="keyword">PROCEDURE</span> &quot;P_ADD_KETTLE&quot; (  </span><br><span class="line">  table_name VARCHAR2) <span class="keyword">AS</span>  </span><br><span class="line"><span class="keyword">BEGIN</span>  </span><br><span class="line">    DBMS_OUTPUT.PUT_LINE(table_name);  </span><br><span class="line">    <span class="comment">--添加时间戳列  </span></span><br><span class="line">    <span class="keyword">EXECUTE</span> IMMEDIATE <span class="string">&#x27;Alter Table &quot;&#x27;</span><span class="operator">||</span> table_name <span class="operator">||</span> <span class="string">&#x27;&quot; add KETTLE_LASTMODIFY TIMESTAMP (6) DEFAULT current_timestamp&#x27;</span>;  </span><br><span class="line">    <span class="keyword">COMMIT</span>;  </span><br><span class="line">    <span class="comment">--添加触发器  </span></span><br><span class="line">    <span class="keyword">EXECUTE</span> IMMEDIATE <span class="string">&#x27;CREATE OR REPLACE TRIGGER KL_&#x27;</span><span class="operator">||</span> SUBSTR(<span class="string">&#x27;KL_&#x27;</span> <span class="operator">||</span> table_name,<span class="number">4</span>,<span class="number">27</span>) <span class="operator">||</span> <span class="string">&#x27;  </span></span><br><span class="line"><span class="string">    BEFORE Insert or Update  ON &quot;&#x27;</span><span class="operator">||</span> table_name <span class="operator">||</span> <span class="string">&#x27;&quot;  </span></span><br><span class="line"><span class="string">    FOR EACH ROW  </span></span><br><span class="line"><span class="string">    DECLARE  </span></span><br><span class="line"><span class="string">      -- local variables here  </span></span><br><span class="line"><span class="string">    BEGIN  </span></span><br><span class="line"><span class="string">      :NEW.KETTLE_LASTMODIFY := current_timestamp;  </span></span><br><span class="line"><span class="string">    END;&#x27;</span>;  </span><br><span class="line">    <span class="keyword">COMMIT</span>;  </span><br><span class="line">  DBMS_OUTPUT.PUT_LINE(<span class="string">&#x27;PROCESS OK...&#x27;</span>);  </span><br><span class="line">  </span><br><span class="line"><span class="keyword">END</span> p_add_kettle;</span><br></pre></td></tr></table></figure>
